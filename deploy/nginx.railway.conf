# همان nginx.conf پروژه، با دو تفاوت به‌خاطر تک‌کانتینر بودن روی Railway:
#   ۱. proxy_pass به 127.0.0.1 (بک‌اند داخل همین کانتینر است، نه سرویس `server`)
#   ۲. listen یک placeholder است — entrypoint آن را با $PORT جای‌گذاری می‌کند
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+webmanifest text/javascript;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /sw-offline.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # SSE پیشرفت دانلود نباید بافر شود
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # دانلود آلبوم طولانی
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 0;
    }
}
