server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ناوبری کلاینت‌ساید است: هر مسیری باید index.html بگیرد، نه ۴۰۴
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE پیشرفت دانلود: بافر nginx رویدادها را تا آخر کار نگه می‌دارد و
        # نوار پیشرفت یک‌باره از صفر به صد می‌پرد
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # دانلود یک آلبوم چند صد مگابایتی می‌تواند طول بکشد
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 0;
    }
}
