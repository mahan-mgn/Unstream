server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # JS اصلی ~412KB است؛ بدون فشرده‌سازی همان 412KB روی سیم می‌رود (~129KB با gzip)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # بدون این، پاسخ‌های پروکسی‌شده (/api) هرگز فشرده نمی‌شوند — پیش‌فرض off است
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+webmanifest text/javascript;

    # پوسته‌ی اپ باید هر بار اعتبارسنجی شود وگرنه دیپلوی جدید دیر می‌رسد
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # سرویس‌ورکر نباید کش بماند وگرنه آپدیت‌های بعدی اپ دیر به کاربر می‌رسد
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /sw-offline.js {
        add_header Cache-Control "no-cache";
    }

    # مانیفست هم همین‌طور. `default_type` عمدی است و نه یک بلوکِ `types`:
    # بلوکِ types در سطحِ server کلِ نقشه‌ی mime را *جایگزین* می‌کند، نه اینکه
    # به آن اضافه کند — و آن‌وقت CSS و JS هم octet-stream می‌شدند. این‌طور فقط
    # وقتی اثر دارد که nginx خودش نوعی برای webmanifest نشناسد؛ اگر بشناسد،
    # همان نوعِ درستِ خودش برنده است.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # دارایی‌های ساختِ Vite اسم هش‌دار دارند، پس امن است که برای همیشه کش شوند
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ناوبری کلاینت‌ساید است: هر مسیری باید index.html بگیرد، نه ۴۰۴
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE پیشرفت دانلود: بافر nginx رویدادها را تا آخر کار نگه می‌دارد و
        # نوار پیشرفت یک‌باره از صفر به صد می‌پرد
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # دانلود یک آلبوم چند صد مگابایتی می‌تواند طول بکشد
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 0;
    }
}
